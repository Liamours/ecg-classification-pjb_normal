[project]
name = "ecg-classification-pjb-normal"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "biosppy>=2.2.4",
    "cffi>=2.1.1",
    "ecg-transform==0.1.3",
    "einops>=0.8.2",
    "hydra-core>=1.3.7",
    "iterative-stratification>=0.1.9",
    "loguru>=0.7.3",
    "numpy",
    "omegaconf>=2.3.1",
    "peakutils>=1.3.5",
    "pyyaml",
    "regex>=2026.9.29",
    "sacrebleu>=2.6.0",
    "safetensors>=0.8.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "timm>=1.0.30",
    "torch>=2.11.0",
    "torcheval>=0.0.7",
    "torchmetrics>=1.9.0",
    "torchvision>=0.26.0",
    "tqdm",
    "transformers>=5.18.0",
    "ultralytics>=8.4.123",
    "umap-learn>=0.5.12",
    "wfdb>=4.3.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
