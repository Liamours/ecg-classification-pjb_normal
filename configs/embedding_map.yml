dataset: mac400-phone_photo
label_column: diagnosis_label
detailed_column: diagnosis_labels_detailed
merge:                 # variant name: parent diagnosis, as in configs/compare.yml
  AVSD INCOMPLETE: AVSD
  CAVSD: AVSD
  EXTREME TOF: TOF
  PENTALOGY OF FALLOT: TOF
  CRITICAL PS: PS
  LARGE PDA: PDA
  MULTIPLE ASD: ASD
batches:               # collection batch of each source folder
  NORMAL: undated
  PJB: undated
  NORMAL 17.12.2024: 17.12.2024
  PJB 17.12.2024: 17.12.2024
  NORMAL 20.12.2024: 19-20.12.2024
  PJB 19.12.2024: 19-20.12.2024
  NORMAL Tambahan: Tambahan
runs:                  # run folder under @inferences holding <dataset>/embeddings.csv
  ecg_jepa_multiblock: infer-ecg_jepa_multiblock
focus: [NORMAL, TOF, AVSD, ASD]   # one panel each: that class opaque, every other page faint; NORMAL = pages with no label
seed: 42
umap: {n_neighbors: 15, min_dist: 0.1}   # umap-learn defaults
tsne: {perplexity: 30}                   # scikit-learn default
colors: {focus: '#C77C4A', rest: '#5F7F9E'}   # two desaturated colours: the focused class and every other page
alpha: {focus: 0.9, rest: 0.08}
out_dir: '@analyses/embedding_maps'
