model: ecg_fm
weights: '@models/ecg_fm-mimic_iv_ecg_finetuned-pretrained/mimic_iv_ecg_finetuned.pt'   # ECG-FM fine-tuned on MIMIC-IV-ECG, 17 sigmoid outputs (third_party/ecg_fm/label_def.csv)
output: embedding     # the model's embedding instead of its label outputs, for the linear probe
fill: tile            # zero: a lead shorter than the model input stays missing and is filled by the model's upstream rule; tile: its digitized stretch is repeated to the input length
device: auto          # cuda when available
batch_size: 32
workers: 4            # data-loader processes for preprocessing, a quarter of the 16 logical cores (one heavy job at a time, wiki/overview/hardware.md)
runs:                 # dataset alias: digitize run holding <page>/record.csv and record.json
  mac400-scan: '@inferences/canonical_mac400-scan'
  mac400-phone_photo: '@inferences/canonical_mac400-phone_photo'
label_column: diagnosis_label
out_dir: '@inferences/infer-ecg_fm_tile_emb'
log_dir: '@logs'
