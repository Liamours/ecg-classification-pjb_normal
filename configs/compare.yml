dataset: mac400-phone_photo
label_column: diagnosis_label
detailed_column: diagnosis_labels_detailed
groups_config: configs/label_schema.yml   # ACC-CHD group of each detailed label
C: 1.0                 # scikit-learn's stock L2 strength on standardized features, not tuned
class_weight: balanced # each label's positives and negatives weigh equally, so the 0.5 threshold is not set by prevalence
threshold: 0.5
out_dir: '@analyses/compare_hierarchy'
folds: '@mac400-phone_photo/_labels/manifest_folds.csv'   # nested cross-validation folds of src.split; the probe fits on train and val, scores test
min_pages: 10          # macro AUROC and AUPRC are averaged over labels with at least this many pages
unknown_label: diagnosis unknown   # a PJB page whose file name carries no diagnosis, at both levels, so it is not read as NORMAL
merge:                 # variant name: parent diagnosis
  AVSD INCOMPLETE: AVSD
  CAVSD: AVSD
  EXTREME TOF: TOF
  PENTALOGY OF FALLOT: TOF
  CRITICAL PS: PS
  LARGE PDA: PDA
  MULTIPLE ASD: ASD
runs:                  # run folder under @inferences: features are its saved predictions.csv or embeddings.csv for the dataset
  ecgfounder: infer-ecgfounder
  ecgfounder_tile: infer-ecgfounder_tile
  ecg_jepa_multiblock: infer-ecg_jepa_multiblock
  ecg_jepa_random: infer-ecg_jepa_random
  ecg_fm: infer-ecg_fm
  ecg_fm_tile: infer-ecg_fm_tile
  hubert_ecg: infer-hubert_ecg            # unsuitable (CC BY-NC), kept for reference
  hubert_ecg_tile: infer-hubert_ecg_tile
  merl_res18: infer-merl_res18            # unsuitable (superseded by MELP), kept for reference
  merl_res18_tile: infer-merl_res18_tile
  merl_vit_tiny: infer-merl_vit_tiny
  merl_vit_tiny_tile: infer-merl_vit_tiny_tile
chd_findings:          # pediatric ECG findings tied to congenital heart defects; a model output whose name matches one counts as fitting our labels
  right ventricular hypertrophy: '\bRIGHT VENTRICULAR HYPERTROPHY\b|\bRVH\b'
  right axis deviation: '\bRIGHT AXIS\b|\bRIGHTWARD AXIS\b|\bRIGHT SUPERIOR AXIS\b|\bRAD\b'
  right atrial enlargement: '\bRIGHT ATRIAL\b|\bRAE\b|\bRAH\b|\bRAO/RAE\b'
  right bundle branch block or rSR prime in V1: "\\bRIGHT BUNDLE\\b|\\bRBBB\\b|\\bIRBBB\\b|\\bCRBBB\\b|RSR'|RIGHT VENTRICULAR CONDUCTION"
  left axis or left anterior fascicular block: '\bLEFT AXIS\b|\bLEFTWARD AXIS\b|\bLEFT ANTERIOR FASCICULAR\b|\bLAFB\b|\bLAD\b'
  left ventricular hypertrophy: '\bLEFT VENTRICULAR HYPERTROPHY\b|\bLVH\b'
  biventricular hypertrophy: '\bBIVENTRICULAR HYPERTROPHY\b'
  left atrial enlargement: '\bLEFT ATRIAL ENLARGEMENT\b|\bLAE\b|\bLAA\b'
  first degree AV block: '\b1ST DEGREE\b|\b1AVB\b|\bFIRST DEGREE\b'
  complete heart block: '\bCOMPLETE HEART BLOCK\b|\b3AVB\b'
  pre-excitation: '\bWOLFF\b|\bWPW\b|\bACCESSORY PATHWAY\b'
  pediatric ECG: '\bPEDIATRIC\b'
