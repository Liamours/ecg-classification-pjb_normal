model: ecg_jepa
weights: '@models/ecg_jepa-pretrained/multiblock_epoch100.pth'   # ECG-JEPA multi-block masking, MIT
fill: zero            # zero: the 4 s record zero-padded to 10 s; tile: each lead's digitized stretch repeated to 10 s
device: cpu
batch_size: 32
runs:                 # dataset alias: digitize run holding <page>/record.csv and record.json
  mac400-scan: '@inferences/canonical_mac400-scan'
  mac400-phone_photo: '@inferences/canonical_mac400-phone_photo'
out_dir: '@inferences/probe-ecg_jepa_multiblock'
log_dir: '@logs'
probe:
  dataset: mac400-phone_photo
  label_column: diagnosis_label
  detailed_column: diagnosis_labels_detailed
  groups_config: configs/label_schema.yml   # ACC-CHD group of each detailed label
  min_pages: 10
  C: 1.0              # scikit-learn's stock L2 strength on standardized embeddings, not tuned
  batches:            # collection batch of each source folder; folds hold out one batch at a time
    NORMAL: undated
    PJB: undated
    NORMAL 17.12.2024: 17.12.2024
    PJB 17.12.2024: 17.12.2024
    NORMAL 20.12.2024: 19-20.12.2024
    PJB 19.12.2024: 19-20.12.2024
    NORMAL Tambahan: Tambahan
