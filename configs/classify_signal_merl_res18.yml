model: merl
arch: resnet18
weights: '@models/merl-pretrained/res18_best_ckpt.pth'   # MERL (ICML 2024) ECG-text model, MIT
text_model: '@models/medcpt_query_encoder-pretrained'   # ncbi/MedCPT-Query-Encoder, MERL's text encoder
prompts:              # added to the authors' CKEPE prompts: our defect names, CHD as a whole, and the right-heart ECG signs
  CHD: congenital heart disease
  ASD: atrial septal defect
  VSD: ventricular septal defect
  PDA: patent ductus arteriosus
  TOF: tetralogy of fallot
  PS: pulmonary valve stenosis
  AVSD: atrioventricular septal defect
  DORV: double outlet right ventricle
  TGA: transposition of the great arteries
  COA: coarctation of the aorta
  PH: pulmonary hypertension
  RAD: right axis deviation
  LAD: left axis deviation
  RVH_PEDIATRIC: right ventricular hypertrophy in a child
  PEDIATRIC_NORMAL: normal pediatric electrocardiogram
fill: zero            # zero: a lead shorter than the model input stays missing and is filled by the model's upstream rule; tile: its digitized stretch is repeated to the input length
device: cpu
batch_size: 32
runs:                 # dataset alias: digitize run holding <page>/record.csv and record.json
  mac400-scan: '@inferences/canonical_mac400-scan'
  mac400-phone_photo: '@inferences/canonical_mac400-phone_photo'
label_column: diagnosis_label
out_dir: '@inferences/classify_signal-merl_res18'
log_dir: '@logs'
top_k: 15             # labels listed in the printed summary
