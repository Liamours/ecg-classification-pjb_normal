<title>ECGFounder Explanation Samples</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one card per example page, labels above its 12 leads in two columns */
:root {
  --bg: #f7f7f6;
  --panel: #ffffff;
  --fg: #1f2226;
  --muted: #6a7078;
  --line: #dcdfe3;
  --pos: #b8432c;
  --neg: #2d6194;
  --neutral: #a3a8ae;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #151719; --panel: #1d2023; --fg: #e5e7ea; --muted: #9aa1a9; --line: #33383e; --pos: #e07a62; --neg: #6fa3d6; --neutral: #5d636a; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #151719; --panel: #1d2023; --fg: #e5e7ea; --muted: #9aa1a9; --line: #33383e; --pos: #e07a62; --neg: #6fa3d6; --neutral: #5d636a; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 16px; }
h1 { font-size: 20px; margin: 0; font-weight: 600; text-wrap: balance; }
.scale { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.bar { width: 160px; height: 8px; border-radius: 2px; background: linear-gradient(90deg, var(--neg), var(--neutral), var(--pos)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
h2 { font-size: 16px; margin: 0; font-weight: 600; }
.file { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 18px; margin: 0; }
dl div { min-width: 0; }
dt { font-size: 12px; color: var(--muted); }
dd { margin: 0; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.svgwrap { overflow-x: auto; }
svg { width: 100%; min-width: 560px; height: auto; display: block; }
svg text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
svg text.miss { font-size: 10px; }
svg text.top { fill: var(--fg); font-weight: 600; }
polyline { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.l0 { stroke: var(--neutral); stroke-width: 1.1; }
__CLASSES__
</style>

<div class="wrap">
  <h1>ECGFounder Explanation Samples</h1>
  <div class="scale"><span>against the explained output</span><span class="bar"></span><span>toward it</span><span>__METHOD__, 4 s of digitized signal per lead</span></div>
  __CARDS__
</div>
