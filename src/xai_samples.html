<title>ECGFounder Explanation Samples</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one card per example page, labels above its 12 leads in two columns; blocks mark stretches, tint marks leads */
:root {
  --bg: #f7f7f6;
  --panel: #ffffff;
  --fg: #1f2226;
  --muted: #6a7078;
  --line: #dcdfe3;
  --trace: #2b2f34;
  --block: #7b5aa6;
  --lead: #e8c84a;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #151719; --panel: #1d2023; --fg: #e5e7ea; --muted: #9aa1a9; --line: #33383e; --trace: #dfe2e6; --block: #a78bd0; --lead: #b8992c; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #151719; --panel: #1d2023; --fg: #e5e7ea; --muted: #9aa1a9; --line: #33383e; --trace: #dfe2e6; --block: #a78bd0; --lead: #b8992c; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 16px; }
h1 { font-size: 20px; margin: 0; font-weight: 600; text-wrap: balance; }
.legend { display: flex; align-items: center; gap: 8px 18px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 12px; border-radius: 2px; border: 1px solid var(--line); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
h2 { font-size: 16px; margin: 0; font-weight: 600; }
.file { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 18px; margin: 0; }
dl div { min-width: 0; }
dt { font-size: 12px; color: var(--muted); }
dd { margin: 0; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.svgwrap { overflow-x: auto; }
svg { width: 100%; min-width: 560px; height: auto; display: block; }
svg text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
svg text.miss { font-size: 10px; }
svg text.top { fill: var(--fg); font-weight: 600; }
rect.box { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
rect.lead { fill: var(--lead); }
rect.block { fill: var(--block); }
polyline { fill: none; stroke: var(--trace); stroke-width: 1.2; stroke-linejoin: round; }
</style>

<div class="wrap">
  <h1>ECGFounder Explanation Samples</h1>
  <div class="legend">
    <span class="key"><span class="sw" style="background:var(--block)"></span>0.2 s stretch whose replacement lowers the explained output (darker: larger drop)</span>
    <span class="key"><span class="sw" style="background:var(--lead)"></span>the __TOP__ leads whose removal lowers it most</span>
  </div>
  __CARDS__
</div>
